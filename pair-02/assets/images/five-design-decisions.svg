<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="490" viewBox="0 0 1130 490" role="img"><rect width="1130" height="490" rx="22" fill="#f5f8ff"/><text x="38" y="53" font-size="29" font-weight="700" fill="#182a50">П’ять рішень перед оформленням</text><text x="39" y="83" font-size="17" font-weight="400" fill="#516583">Пройди ці перевірки до створення Desktop-макета</text><rect x="32" y="113" width="344" height="165" rx="16" fill="white" stroke="#cbd8f0" stroke-width="1.5"/><rect x="50" y="131" width="44" height="44" rx="11" fill="#e5ecff" stroke="#e5ecff" stroke-width="1.5"/><text x="60" y="160" font-size="19" font-weight="700" fill="#3659cc">01</text><text x="108" y="159" font-size="23" font-weight="700" fill="#182a50">Ієрархія</text><text x="52" y="205" font-size="18" font-weight="700" fill="#182a50">Що помітно першим?</text><text x="52" y="239" font-size="15" font-weight="400" fill="#516583">Головна дія має виділятися.</text><rect x="393" y="113" width="344" height="165" rx="16" fill="white" stroke="#cbd8f0" stroke-width="1.5"/><rect x="411" y="131" width="44" height="44" rx="11" fill="#e5ecff" stroke="#e5ecff" stroke-width="1.5"/><text x="421" y="160" font-size="19" font-weight="700" fill="#3659cc">02</text><text x="469" y="159" font-size="23" font-weight="700" fill="#182a50">Типографіка</text><text x="413" y="205" font-size="18" font-weight="700" fill="#182a50">Які текстові стилі?</text><text x="413" y="239" font-size="15" font-weight="400" fill="#516583">Використай дизайн-систему.</text><rect x="754" y="113" width="344" height="165" rx="16" fill="white" stroke="#cbd8f0" stroke-width="1.5"/><rect x="772" y="131" width="44" height="44" rx="11" fill="#e5ecff" stroke="#e5ecff" stroke-width="1.5"/><text x="782" y="160" font-size="19" font-weight="700" fill="#3659cc">03</text><text x="830" y="159" font-size="23" font-weight="700" fill="#182a50">Колір</text><text x="774" y="205" font-size="18" font-weight="700" fill="#182a50">Які ролі кольорів?</text><text x="774" y="239" font-size="15" font-weight="400" fill="#516583">Токени замість випадкових тонів.</text><rect x="32" y="297" width="344" height="165" rx="16" fill="white" stroke="#cbd8f0" stroke-width="1.5"/><rect x="50" y="315" width="44" height="44" rx="11" fill="#e5ecff" stroke="#e5ecff" stroke-width="1.5"/><text x="60" y="344" font-size="19" font-weight="700" fill="#3659cc">04</text><text x="108" y="343" font-size="23" font-weight="700" fill="#182a50">Відступи</text><text x="52" y="389" font-size="18" font-weight="700" fill="#182a50">Як організовано простір?</text><text x="52" y="423" font-size="15" font-weight="400" fill="#516583">Єдина шкала та Auto Layout.</text><rect x="393" y="297" width="344" height="165" rx="16" fill="white" stroke="#cbd8f0" stroke-width="1.5"/><rect x="411" y="315" width="44" height="44" rx="11" fill="#e5ecff" stroke="#e5ecff" stroke-width="1.5"/><text x="421" y="344" font-size="19" font-weight="700" fill="#3659cc">05</text><text x="469" y="343" font-size="23" font-weight="700" fill="#182a50">Компоненти</text><text x="413" y="389" font-size="18" font-weight="700" fill="#182a50">Що повторюється?</text><text x="413" y="423" font-size="15" font-weight="400" fill="#516583">Екземпляри та стани.</text><rect x="757" y="297" width="341" height="165" rx="16" fill="#eaf6f4" stroke="#b8dcd8" stroke-width="1.5"/><text x="780" y="341" font-size="21" font-weight="700" fill="#178b8b">Після п’яти рішень</text><text x="780" y="379" font-size="19" font-weight="400" fill="#182a50">Створи перший екран</text><text x="780" y="411" font-size="19" font-weight="400" fill="#182a50">і перевір його в Figma.</text></svg>