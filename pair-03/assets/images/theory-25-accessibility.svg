<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 495" role="img"><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#172747}.head{font-size:26px;font-weight:700}.sub{font-size:18px}.small{font-size:15px}.blue{fill:#1559c8}.line{stroke:#2364cb;stroke-width:3;fill:none}.card{fill:#f4f7ff;stroke:#c7d7f2;stroke-width:2}</style><rect x="1" y="1" width="1198" height="493" rx="24" fill="#fff" stroke="#c9d9f5" stroke-width="2"/><text x="37" y="48" class="head">Зручність мобільного інтерфейсу: що перевірити</text>
<rect x="37" y="78" width="537" height="305" rx="16" fill="#fff5f5" stroke="#edc5c8" stroke-width="2"/><text x="59" y="115" class="head" fill="#a11c30">✕ Незручно</text><rect x="101" y="148" width="110" height="28" rx="6" fill="#2465ce"/><text x="120" y="168" class="small" style="fill:white">Додати</text><path d="M230 148 V176 M223 148 H237 M223 176 H237" class="line"/><text x="244" y="168" class="sub">28 px висоти</text><text x="60" y="223" class="sub">• Дрібна сенсорна ціль</text><text x="60" y="254" class="sub">• Тісно розташовані кнопки</text><text x="60" y="285" class="sub">• Основну дію важко знайти</text>
<rect x="598" y="78" width="563" height="305" rx="16" fill="#effaf5" stroke="#b4e0cb" stroke-width="2"/><text x="621" y="115" class="head">✓ Зручніше</text><rect x="653" y="141" width="147" height="48" rx="10" fill="#2465ce"/><text x="686" y="170" class="sub" style="fill:white">Додати</text><path d="M820 141 V189 M813 141 H827 M813 189 H827" class="line"/><text x="839" y="168" class="sub">48 px висоти</text><text x="620" y="223" class="sub">• Читабельний текст</text><text x="620" y="254" class="sub">• Достатньо простору для натискання</text><text x="620" y="285" class="sub">• Головна дія доступна</text>
<rect x="37" y="399" width="1124" height="78" rx="12" fill="#e8f0ff"/><text x="58" y="429" class="sub">44 × 44 px — практичний орієнтир для важливих сенсорних цілей, а не універсальна вимога WCAG.</text><text x="58" y="458" class="sub">Перевір також навігацію, перенесення тексту та відсутність зайвого горизонтального прокручування.</text></svg>