<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">Різні сторінки — різні завдання</title><desc id="d">Обирай структуру за потребою користувача, а не копіюй головну сторінку.</desc><rect width="1120" height="560" rx="28" fill="#f6f7ff"/><rect x="24" y="24" width="1072" height="512" rx="24" fill="#fff" stroke="#d8ddf8"/><text x="56" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17244a">Різні сторінки — різні завдання</text><text x="56" y="116" font-family="Arial,sans-serif" font-size="18" fill="#52627f">Обирай структуру за потребою користувача, а не копіюй головну сторінку.</text>
<rect x="56" y="157" width="325" height="284" rx="19" fill="#3765cf" fill-opacity=".08" stroke="#3765cf" stroke-opacity=".45" stroke-width="2"/>
<rect x="72" y="174" width="293" height="45" rx="12" fill="#3765cf"/>
<text x="219" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Каталог</text>
<text x="75" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Пошук і фільтри</text>
<text x="75" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Список пропозицій</text>
<text x="75" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Картки для вибору</text>
<rect x="397" y="157" width="325" height="284" rx="19" fill="#7650cf" fill-opacity=".08" stroke="#7650cf" stroke-opacity=".45" stroke-width="2"/>
<rect x="413" y="174" width="293" height="45" rx="12" fill="#7650cf"/>
<text x="560" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Деталі</text>
<text x="416" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Назва й опис</text>
<text x="416" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Ключові характеристики</text>
<text x="416" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Помітна основна дія</text>
<rect x="739" y="157" width="325" height="284" rx="19" fill="#238e83" fill-opacity=".08" stroke="#238e83" stroke-opacity=".45" stroke-width="2"/>
<rect x="755" y="174" width="293" height="45" rx="12" fill="#238e83"/>
<text x="901" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Профіль</text>
<text x="758" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Особисті дані</text>
<text x="758" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Налаштування</text>
<text x="758" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Статус і прогрес</text>
<rect x="56" y="462" width="1008" height="54" rx="13" fill="#edeafd"/><text x="75" y="495" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#493a91">Перевір: чи легко виконати головну дію саме на цій сторінці?</text>
</svg>