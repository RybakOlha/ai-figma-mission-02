<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">Аудит цілісності продукту</title><desc id="d">Порівняй головну та внутрішню сторінки до прототипування.</desc><rect width="1120" height="560" rx="28" fill="#f6f7ff"/><rect x="24" y="24" width="1072" height="512" rx="24" fill="#fff" stroke="#d8ddf8"/><text x="56" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17244a">Аудит цілісності продукту</text><text x="56" y="116" font-family="Arial,sans-serif" font-size="18" fill="#52627f">Порівняй головну та внутрішню сторінки до прототипування.</text>
<rect x="56" y="157" width="325" height="284" rx="19" fill="#3765cf" fill-opacity=".08" stroke="#3765cf" stroke-opacity=".45" stroke-width="2"/>
<rect x="72" y="174" width="293" height="45" rx="12" fill="#3765cf"/>
<text x="219" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Спорідненість</text>
<text x="75" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Спільна навігація</text>
<text x="75" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Типографіка і стилі</text>
<text x="75" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Однакові назви</text>
<rect x="397" y="157" width="325" height="284" rx="19" fill="#7650cf" fill-opacity=".08" stroke="#7650cf" stroke-opacity=".45" stroke-width="2"/>
<rect x="413" y="174" width="293" height="45" rx="12" fill="#7650cf"/>
<text x="560" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Орієнтація</text>
<text x="416" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Поточний розділ</text>
<text x="416" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Зрозуміле повернення</text>
<text x="416" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Передбачувана дія</text>
<rect x="739" y="157" width="325" height="284" rx="19" fill="#238e83" fill-opacity=".08" stroke="#238e83" stroke-opacity=".45" stroke-width="2"/>
<rect x="755" y="174" width="293" height="45" rx="12" fill="#238e83"/>
<text x="901" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Адаптивність</text>
<text x="758" y="258" font-family="Arial,sans-serif" font-size="18" fill="#253354">Читабельність</text>
<text x="758" y="291" font-family="Arial,sans-serif" font-size="18" fill="#253354">Головна дія доступна</text>
<text x="758" y="324" font-family="Arial,sans-serif" font-size="18" fill="#253354">Без втрати змісту</text>
<rect x="56" y="462" width="1008" height="54" rx="13" fill="#edeafd"/><text x="75" y="495" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#493a91">Переходи зараз плануємо; клікабельність налаштуємо в Парі 05.</text>
