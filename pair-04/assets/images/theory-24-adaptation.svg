<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">Адаптація внутрішньої сторінки</title><desc id="d">Ті самі функції — інший пріоритет і компонування.</desc><rect width="1120" height="560" rx="28" fill="#f6f7ff"/><rect x="24" y="24" width="1072" height="512" rx="24" fill="#fff" stroke="#d8ddf8"/><text x="56" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17244a">Адаптація внутрішньої сторінки</text><text x="56" y="116" font-family="Arial,sans-serif" font-size="18" fill="#52627f">Ті самі функції — інший пріоритет і компонування.</text>
